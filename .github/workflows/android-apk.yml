name: Build Wingart Ctrl
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------- Android APK ----------------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK (small release build, falls back to debug build)
        run: gradle -p android assembleRelease --no-daemon --stacktrace || gradle -p android assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then cp android/app/build/outputs/apk/release/app-release.apk WingartCtrl.apk; else cp android/app/build/outputs/apk/debug/app-debug.apk WingartCtrl.apk; fi
          ls -l WingartCtrl.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WingartCtrl-Android-APK
          path: WingartCtrl.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Wingart Ctrl - latest APK
          prerelease: true
          files: WingartCtrl.apk

  # ---------------- Windows: one exe per CPU type ----------------
  windows-exe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: Build exe
        working-directory: windows
        run: python build.py --build-only --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.arch }}
          path: |
            windows/dist_${{ matrix.arch }}/WingartCtrl.exe
            windows/ViGEmBusSetup_${{ matrix.arch }}.msi
          if-no-files-found: error

  # ---------------- Windows: ONE installer for 32-bit + 64-bit ----------------
  windows-installer:
    needs: windows-exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: exe-*
          merge-multiple: true
          path: windows
      - name: Build installer
        working-directory: windows
        shell: pwsh
        run: |
          Get-ChildItem -Recurse . -Include *.exe,*.msi | Select-Object FullName
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: WingartCtrl-Windows-Setup
          path: windows/Output/WingartCtrl-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Wingart Ctrl - Windows installer (32 + 64 bit)
          prerelease: true
          files: windows/Output/WingartCtrl-Setup.exe
