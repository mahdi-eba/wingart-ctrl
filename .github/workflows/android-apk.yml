name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WingartCtrl.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WingartCtrl-Android-APK
          path: WingartCtrl.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Wingart Ctrl - latest APK
          prerelease: true
          files: WingartCtrl.apk
